[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marinelab"
version = "0.2.0"
description = "A general-purpose underwater-vehicle (UUV) environment framework for Isaac Lab."
requires-python = ">=3.10"
dependencies = ["gymnasium", "torch", "numpy"]

[tool.setuptools.packages.find]
include = ["marinelab*"]

[project.entry-points."isaaclab.extensions"]
marinelab = "marinelab"
