[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marinelab"
version = "0.1.0"
description = "Underwater-vehicle environments and shared marine physics for Isaac Lab."
requires-python = ">=3.10"
dependencies = ["gymnasium", "torch", "numpy"]

[tool.setuptools.packages.find]
include = ["marinelab*"]

[project.entry-points."isaaclab.extensions"]
marinelab = "marinelab"
